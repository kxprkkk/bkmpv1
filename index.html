  'import-mode': (el) => { ui.importMode = el.value; try { ui.importPlan = buildImport(ui.importRows, ui.importMode); } catch (e) { ui.importError = e.message; } render(); },
};
const inputs = {
  'cl-q': debounce((el) => { ui.clients.q = el.value; refreshClients(); }, 120),
  'cs-q': debounce((el) => { ui.cases.q = el.value; refreshCases(); }, 120),
};

function bindEvents() {
  document.addEventListener('click', (e) => {
    if (!S) return;
    const a = e.target.closest('[data-action]');
    if (a && actions[a.dataset.action] && !a.closest('.modal-wrap.out')) {
      if (a.dataset.action !== 'client-menu') closeMenus();
      if (a.tagName === 'A' && a.dataset.action !== 'cases-active') e.preventDefault();
      actions[a.dataset.action](a, e);
      return;
    }
    if (!e.target.closest('.menu') && !e.target.closest('[aria-haspopup="menu"]')) closeMenus();
    if (e.target.closest('a,button,select,input,textarea,label')) return;
    const row = e.target.closest('tr[data-href]');
    if (row) { location.hash = row.dataset.href; return; }
    const caseRow = e.target.closest('[data-case-row]');
    if (caseRow) { openCaseForm({ caseId: Number(caseRow.dataset.caseRow) }); return; }
    const caseEl = e.target.closest('[data-case]');
    if (caseEl) openCaseForm({ caseId: Number(caseEl.dataset.case) });
  });
  document.addEventListener('change', (e) => {
    if (!S) return;
    const el = e.target.closest('[data-change]');
    if (el && changes[el.dataset.change]) changes[el.dataset.change](el, e);
  });
  document.addEventListener('input', (e) => {
    if (!S) return;
    const el = e.target.closest('[data-input]');
    if (el && inputs[el.dataset.input]) inputs[el.dataset.input](el, e);
  });
  document.addEventListener('keydown', (e) => {
    resetIdle();
    if (!S) return;
    const top = modalStack[modalStack.length - 1];
    if (e.key === 'Escape') {
      if (top) { e.preventDefault(); top.close(); return; }
      const open = document.querySelector('.menu.open');
      if (open) { closeMenus(); const t = document.querySelector('[aria-haspopup="menu"]'); if (t) t.focus(); return; }
    }
    if (top && e.key === 'Tab') {
      const f = [...top.wrap.querySelectorAll('a[href],button:not([disabled]),input:not([type=hidden]):not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])')].filter((x) => x.offsetParent !== null);
      if (f.length) {
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
    if (!top && ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'))) {
      e.preventDefault(); const gi = document.getElementById('gsearch-input'); if (gi) gi.focus();
    }
    if (e.key === 'Enter' && !typing && !top) {
      const t = document.activeElement;
      if (t && t.matches('tr[data-href]')) location.hash = t.dataset.href;
      else if (t && t.matches('[data-case-row]')) openCaseForm({ caseId: Number(t.dataset.caseRow) });
      else if (t && t.matches('[data-case]')) openCaseForm({ caseId: Number(t.dataset.case) });
    }
  });
  ['pointerdown', 'wheel'].forEach((ev) => document.addEventListener(ev, resetIdle, { passive: true }));
  window.addEventListener('hashchange', () => {
    if (!S) return;
    if (notesFlush) { notesFlush(); notesFlush = null; }
    while (modalStack.length) modalStack[modalStack.length - 1].close(true);
    if (route().name !== 'klient') ui.clientTab = 'cases';
    render(); window.scrollTo(0, 0);
  });
  window.addEventListener('beforeunload', () => { if (notesFlush) notesFlush(); });
  window.addEventListener('storage', async (e) => {
    if (e.key !== STORAGE_KEY || !S) return;
    try {
      let text = e.newValue;
      if (!text) { S = freshState(); }
      else if (Crypto.isEnvelope(text)) { if (!Crypto.key) return; text = await Crypto.decrypt(text, Crypto.key); S = migrate(JSON.parse(text)); }
      else S = migrate(JSON.parse(text));
      reindex(); render(); toast('Dane zostały zmienione w innej karcie – widok odświeżono.');
    } catch (err) { console.error(err); }
  });
  setInterval(() => { if (Crypto.key && S && Date.now() - lastActivity > LOCK_IDLE_MIN * 60000) lockNow(); }, 30000);
  setInterval(() => checkBackupReminder(), 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkBackupReminder(); });
  window.addEventListener('resize', debounce(() => { if (S) fitGrid(); }, 100));
}


/* =========================================================================
   PRZYPOMNIENIE O KOPII ZAPASOWEJ
   Pojawia się, gdy w danych są zmiany, a od ostatniej kopii (lub od pierwszej
   zmiany, jeśli kopii jeszcze nie było) minęły 3 godziny.
   ========================================================================= */
let reminderOpen = false;
function backupReminderDue(now = Date.now()) {
  if (!S || S.meta.demo || !S.clients.length || !S.meta.dirtySince) return false;
  const ref = new Date(S.meta.lastBackupAt || S.meta.dirtySince).getTime();
  const snooze = S.meta.backupSnoozeUntil ? new Date(S.meta.backupSnoozeUntil).getTime() : 0;
  return now - ref >= BACKUP_REMIND_MS && now >= snooze;
}
function checkBackupReminder(now = Date.now()) {
  if (reminderOpen || modalStack.length || document.hidden || !backupReminderDue(now)) return false;
  reminderOpen = true;
  let handled = false;
  const hours = Math.floor((now - new Date(S.meta.lastBackupAt || S.meta.dirtySince).getTime()) / 3600000);
  const m = openModal({
    title: 'Czas na kopię zapasową',
    body: `<div class="modal-body"><p style="margin:0 0 10px">${S.meta.lastBackupAt ? `Od ostatniej kopii zapasowej minęło ${countOf(hours, 'godzina', 'godziny', 'godzin')}` : 'Nie pobrano jeszcze żadnej kopii zapasowej'}, a w danych są zmiany.</p><p class="sub" style="margin:0">Kopia zapisana na dysku chroni dane przed utratą, np. po wyczyszczeniu przeglądarki albo awarii komputera.</p></div>
      <div class="modal-foot"><span class="spacer"></span><button class="btn" type="button" data-snooze>Przypomnij za godzinę</button><button class="btn btn-primary" type="button" data-backup>${icon('download', 16)}Pobierz kopię</button></div>`,
    onMount(w) {
      w.querySelector('[data-snooze]').addEventListener('click', () => m.close(true));
      w.querySelector('[data-backup]').addEventListener('click', async () => { if (await exportJSON()) { handled = true; m.close(true); } });
    },
  });
  const orig = m.close;
  m.close = (force) => {
    orig(force);
    reminderOpen = false;
    if (!handled && S) { S.meta.backupSnoozeUntil = new Date(Date.now() + 3600000).toISOString(); persist(); }
  };
  const b = m.wrap.querySelector('[data-backup]'); if (b) b.focus();
  return true;
}

/* =========================================================================
   START
   ========================================================================= */
function startApp() {
  reindex();
  purgeOldTrash();
  renderShell();
  render();
  resetIdle();
  setTimeout(() => checkBackupReminder(), 4000);
  if (S.meta.lastAutoSnapDay !== todayISO() && S.clients.length && !S.meta.demo) {
    takeSnapshot('Kopia dzienna').then(() => { if (S) { S.meta.lastAutoSnapDay = todayISO(); persist(); } });
  }
}
function boot() {
  document.getElementById('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(SYGNET.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" '));
  bindEvents();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  window.addEventListener('error', (e) => { console.error(e.error || e.message); });
  window.addEventListener('unhandledrejection', (e) => { console.error(e.reason); toast('Wystąpił nieoczekiwany błąd. Odśwież stronę – zapisane dane są bezpieczne.', { type: 'error' }); });
  const loaded = loadState();
  if (loaded === 'locked') { if (!Crypto.available) { document.getElementById('root').innerHTML = '<div class="lock"><div class="card"><h1>BKMP CRM</h1><p>Dane są zaszyfrowane, a ta przeglądarka nie obsługuje szyfrowania. Otwórz aplikację z pliku na dysku albo z adresu https.</p></div></div>'; return; } showLock(); return; }
  S = loaded;
  startApp();
}
// Dostęp dla testów automatycznych – tylko po dopisaniu ?test do adresu.
if (/[?&]test\b/.test(location.search)) {
  window.__bkmp = { parseAmount, parsePercent, parseDate, parseMonth, parseYear, extractPhones, bankCanon, normStatus, parseDelimited, buildImport: (rows, mode) => buildImport(rows, mode), state: () => S, snaps: () => readSnaps(), lockNow: () => lockNow(), checkBackupReminder: (t) => checkBackupReminder(t), backupReminderDue: (t) => backupReminderDue(t) };
}
boot();
})();
</script>
